; The `skynet` theme: legacy's windows and art, forged (docs/rmlui-ui-system/theming-and-modding.md, "Reforge").
; Every document, stylesheet and token comes from legacy unless this folder has its own; tokens.ini here changes
; only the colours a forged window needs (titles, cell tint, window shadow).
[Theme]
Base=legacy

; Declared capabilities (RmlTheme.h); NativeTextSize comes from legacy.
;   RichItemTooltip=1  item tooltips get a header styled by rarity, divided blocks and a short view with a Shift hint
;                      (UI/Tooltip/ItemTooltipLayout.h, tooltip.rml + tooltip_rich.rcss here)
;   ItemRarityCells=1  inventory cells and worn slots show an item's rarity and upgrade band
;                      (UI/Inventory/ItemCellRarityClass.h, cell-* tokens in tokens.ini)
[Capabilities]
RichItemTooltip=1
ItemRarityCells=1

; Read by UI::RmlBridge::GetThemeDisplayName() -- the label COptionWindow's UI Theme dropdown shows for this theme.
[Meta]
DisplayName=Skynet

; The sprites RmlUi recolours as it loads them, original or HD (ThemeReforge.h, SpriteReforge.h). A key is the
; file's path under Data/Interface/, lower-case, without its extension; the value is a preset:
;   metal       frames: dark iron, antique gold on the light curls, deeper relief, a warm glow
;   metal-flat  thin or tiling frame pieces and buttons: the metal colours without relief or glow
;   metal-bright  buttons with a light icon (the HUD's menu buttons): metal-flat, lifted so the icon stays
;               readable
;   cell        the inventory cell lattice: dark bronze lines
;   stone       window bodies: warm dark stone, lit from the top
;   socket      equipment slots: a dark recess, bronze lines
;   gild        the HUD's current-skill box (partcharge1/newui_menu03): metal, its green frame gold and its
;               green fill deep bronze
;   none        as it is (turns off a parent theme's entry)
; A `metal` piece that shows a seam where it meets its neighbour goes to `metal-flat`. The life, mana, SD and AG
; orbs, the level button and every item icon are left as they are.
[Reforge]
