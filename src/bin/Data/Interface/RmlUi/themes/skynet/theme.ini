; The `skynet` theme: legacy's windows and art, forged (docs/rmlui-ui-system/theming-and-modding.md, "Reforge").
; Every document, stylesheet and token comes from legacy unless this folder has its own; tokens.ini here changes
; only the colours a forged window needs (titles, cell tint, window shadow).
[Theme]
Base=legacy

; Declared capabilities (RmlTheme.h); NativeTextSize comes from legacy.
;   RichItemTooltip=1  item tooltips get a header styled by rarity, divided blocks and a short view with a Shift hint
;                      (UI/Tooltip/ItemTooltipLayout.h, tooltip.rml + tooltip_rich.rcss here)
;   ItemRarityCells=1  inventory cells and worn slots show an item's rarity and upgrade band
;                      (UI/Inventory/ItemCellRarityClass.h, cell-* tokens in tokens.ini)
;   LiveHud=1          the HUD's life and mana gems are live: liquid with a wave, a damage ghost and a sheen; the
;                      skill slots get a cooldown sweep, seconds and a ready flash, the EXP bar a spark
;                      (UI/HUD/LiveHud.h, main_frame_live.rcss and hud-* tokens here, [LiveHud] below)
[Capabilities]
RichItemTooltip=1
ItemRarityCells=1
LiveHud=1

; The live HUD's shapes and timings (UI/HUD/LiveGaugeMath.h, LiveHudConfig); every key is optional and these are the
; defaults. Sizes are dp, times seconds, angles degrees clockwise from 3 o'clock.
;   GemOutline       the gem's convex outline, x,y pairs in percent of the gem's box
;   GemZoom          the gem art's zoom about its centre (cuts off its corner curls), at least 1
;   EmptyShade       the art's brightness above the liquid
;   CrestTint        the crest's brightness at the liquid's surface
;   WaveAmplitude    the liquid surface's wave; WavePeriodLife / WavePeriodMana its period in each gem
;   ArcStart, ArcSweep, ArcWidth          the SD and AG rings round the gems
;   LowLife, PulsePeriod, PulseStrength   the life gem's pulse under this share of life
;   HaloLife, HaloMana, HaloPoison        the glow round each gem, #rrggbb
;   SweepShade       the skill cooldown's shade, #rrggbbaa
;   RimOuter, RimInner, RimWidth          the socket's rim round each gem: its outer and inner colour, #rrggbb, and
;                    its width; the two colours also make the SD and AG rings' track (outer at its edges, inner
;                    in its middle)
;   SparkColour      the EXP spark's and the level-up band's colour, #rrggbb
;   SparkRadius, SparkPeak                the EXP spark round the fill's end: its size and its brightness at the top
;                    of its breathing (0..1)
;   SparkPeriod      the spark's breathing cycle; SparkStill its brightness, a share of SparkPeak, with HudEffects off
;   FlareTime, FlareRadius, FlareBrightness   an EXP gain's flare: how long it takes to fall back, and how many times
;                    as big and as bright it makes the spark at its start (at least 1)
;   BandTime, BandHalfWidth, BandStrength     the level-up: the band crossing the EXP bar (and the sheen crossing
;                    both gems) takes BandTime; the band reaches BandHalfWidth either side of its line, BandStrength
;                    (0..1) bright on it
[LiveHud]
GemOutline=25,3 75,3 96,32 96,70 68,97 32,97 5,70 5,32
GemZoom=1.32
EmptyShade=0.30
CrestTint=0.30
WaveAmplitude=1.2
WavePeriodLife=2.6
WavePeriodMana=3.3
ArcStart=140
ArcSweep=260
ArcWidth=3.5
LowLife=0.30
PulsePeriod=1.2
PulseStrength=0.22
HaloLife=#ff3418
HaloMana=#2870ff
HaloPoison=#30c040
SweepShade=#060403cc
RimOuter=#5c462a
RimInner=#0b0907
RimWidth=1.5
SparkColour=#ffd778
SparkRadius=5
SparkPeak=0.6
SparkPeriod=1.4
SparkStill=0.825
FlareTime=0.8
FlareRadius=1.8
FlareBrightness=1.5
BandTime=0.9
BandHalfWidth=16
BandStrength=0.8

; Read by UI::RmlBridge::GetThemeDisplayName() -- the label COptionWindow's UI Theme dropdown shows for this theme.
[Meta]
DisplayName=Skynet

; The sprites RmlUi recolours as it loads them, original or HD (ThemeReforge.h, SpriteReforge.h). A key is the
; file's path under Data/Interface/, lower-case, without its extension; the value is a preset:
;   metal       frames: dark iron, antique gold on the light curls, deeper relief, a warm glow
;   metal-flat  thin or tiling frame pieces and buttons: the metal colours without relief or glow
;   metal-bright  buttons with a light icon (the HUD's menu buttons): metal-flat, lifted so the icon stays
;               readable
;   cell        the inventory cell lattice: dark bronze lines
;   stone       window bodies: warm dark stone, lit from the top
;   socket      equipment slots: a dark recess, bronze lines
;   gild        the HUD's current-skill box (partcharge1/newui_menu03): metal, its green frame gold and its
;               green fill deep bronze
;   none        as it is (turns off a parent theme's entry)
; A `metal` piece that shows a seam where it meets its neighbour goes to `metal-flat`. The life, mana, SD and AG
; orbs, the level button and every item icon are left as they are.
[Reforge]
; Window bodies.
newui_msgbox_back=stone

