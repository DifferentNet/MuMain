; Design tokens for the `skynet` theme. Every token not named here is legacy's (themes/legacy/tokens.ini): only the
; colours that go with the forged art ([Reforge] in theme.ini) change. Gold is legacy's own accent-gold.
[Tokens]

; Window titles: gold with a soft warm glow under the letters.
window-title-color=#ffd23c
window-title-effect=glow(0px 2px 0px 0px #ff9a3c80)
; Group-box titles of the docked windows (docked_panel_frame.rcss).
text-heading=#ffd23c
; Level, stat names and values of the character window.
stat-accent=#ffd23c

; A shadow under the inventory and docked windows, so they stand off the world.
window-shadow=0px 8px 18px rgba(0, 0, 0, 190)

; An inventory cell's tint: warm dark bronze instead of the original's teal.
cell-tint-normal=rgba(64, 50, 34, 150)

; Every skynet tooltip (tooltip_rich.rcss): a warm dark box in a bronze frame; a rich item tooltip also casts a shadow.
tooltip-bg=rgba(12, 9, 7, 250)
tooltip-edge=#7d6440
tooltip-shadow=0px 10px 22px rgba(0, 0, 0, 190)
; A rich item tooltip's subtitle (the item kind under the name), its +13..+15 frame and the frame's glow.
tt-kind-color=#cbbfa9
tt-gold=#e6b95a
tt-gold-glow=rgba(255, 190, 80, 160)
; Its header bar, by the item's rarity (the name keeps its own colour).
tt-head-normal=#3a3129
tt-head-magic=#22304a
tt-head-fine=#4a3c14
tt-head-exc=#11563a
tt-head-anc=#2b3db6
tt-head-socket=#3b2466
tt-head-special=#4a3c14
tt-head-divine=#4a1450

; An item's rarity on its inventory cells and worn slot (ItemRarityCells in theme.ini; item_grid.rcss,
; my_inventory.rcss): the tint replaces cell-tint-normal, a frame runs round the item's outer edge. +13..+15 tints a
; plain item gold, and its gold frame wins over the rarity's, drawn cell-frame-gold-width wide so it reads at a glance.
cell-tint-exc=rgba(26, 255, 128, 60)
cell-tint-anc=rgba(60, 100, 255, 95)
cell-tint-socket=rgba(150, 90, 255, 70)
cell-tint-gold=rgba(255, 200, 90, 70)
cell-frame-width=1px
cell-frame-gold-width=2px
cell-frame-fine=#b8952a
cell-frame-exc=#1aa866
cell-frame-anc=#4f6fe0
cell-frame-socket=#8a55d6
cell-frame-gold=#e6b95a
