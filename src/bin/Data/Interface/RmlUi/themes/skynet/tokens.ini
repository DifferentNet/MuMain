; Design tokens for the `skynet` theme. Every token not named here is legacy's (themes/legacy/tokens.ini): only the
; colours that go with the forged art ([Reforge] in theme.ini) change. Gold is legacy's own accent-gold.
[Tokens]

; Window titles: gold with a soft warm glow under the letters.
window-title-color=#ffd23c
window-title-effect=glow(0px 2px 0px 0px #ff9a3c80)
; Group-box titles of the docked windows (docked_panel_frame.rcss).
text-heading=#ffd23c
; Level, stat names and values of the character window.
stat-accent=#ffd23c

; A shadow under the inventory and docked windows, so they stand off the world.
window-shadow=0px 8px 18px rgba(0, 0, 0, 190)

; An inventory cell's tint: warm dark bronze instead of the original's teal.
cell-tint-normal=rgba(64, 50, 34, 150)
