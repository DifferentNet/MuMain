<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MU Online (web)</title>
<style>
  :root { --bg: #0d0e12; --panel: #16181f; --line: rgba(255,255,255,.12); --ink: #f2eee6; --muted: #a0a5b1; --gold: #e5b95c; --bad: #f2766a; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.5 "Segoe UI", system-ui, sans-serif; }
  #stage { display: flex; align-items: center; justify-content: center; height: calc(100% - 2.5rem); overflow: hidden; }
  #stage:fullscreen { height: 100%; background: #000; }
  /* "Auto": the canvas is the stage's size to the device pixel; at its corner, half a pixel off would blur it. */
  #stage.auto { align-items: flex-start; justify-content: flex-start; }
  /* fitCanvas() below sizes the canvas to the stage; the game picks its resolution (Options, "Auto" by default). */
  #canvas { display: block; flex: none; background: #000; outline: none; }
  #status { position: absolute; inset: 0 0 2.5rem 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 1rem; pointer-events: none; }
  #status.bad { color: var(--bad); }
  #status[hidden] { display: none; }
  footer { height: 2.5rem; display: flex; gap: 1rem; align-items: center; padding: 0 1rem; border-top: 1px solid var(--line); background: var(--panel); color: var(--muted); font-size: .8125rem; }
  footer button { font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 4px; padding: .15rem .6rem; cursor: pointer; }
  footer select { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: .1rem .3rem; }
  footer label { white-space: nowrap; }
  /* Phones: the buttons and the quality choice fit on one line without the title. */
  @media (max-width: 520px) { footer { gap: .5rem; padding: 0 .5rem; } footer > span { display: none; } }
  footer button:focus-visible, footer select:focus-visible { outline: 2px solid var(--gold); }
  #log { position: fixed; left: 0; right: 0; bottom: 2.5rem; height: 40%; margin: 0; padding: .5rem 1rem; overflow: auto; background: rgba(13,14,18,.96); border-top: 1px solid var(--line); font: 12px/1.4 ui-monospace, Consolas, monospace; white-space: pre-wrap; }
  #log[hidden] { display: none; }
  .err { color: var(--bad); }
</style>
</head>
<body>
<div id="stage"><canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas></div>
<div id="status">Loading…</div>
<pre id="log" hidden></pre>
<footer>
  <span>MU Online in the browser</span>
  <button id="toggle-log" type="button">Log</button>
  <button id="fullscreen" type="button">Fullscreen</button>
  <label title="How many pixels the game draws while Options has Auto resolution">Quality
    <select id="quality">
      <option value="high">High</option>
      <option value="medium">Medium</option>
      <option value="low">Low</option>
    </select>
  </label>
</footer>
<script>
  const statusEl = document.getElementById("status");
  const logEl = document.getElementById("log");
  const canvas = document.getElementById("canvas");
  function setStatus(text, bad) {
    statusEl.hidden = !text;
    statusEl.textContent = text || "";
    statusEl.classList.toggle("bad", !!bad);
  }
  function appendLog(text, isError) {
    const line = document.createElement("div");
    if (isError) line.className = "err";
    line.textContent = text;
    logEl.appendChild(line);
    if (logEl.childElementCount > 3000) logEl.firstChild.remove();
    logEl.scrollTop = logEl.scrollHeight;
  }
  document.getElementById("toggle-log").onclick = () => { logEl.hidden = !logEl.hidden; };
  const stage = document.getElementById("stage");
  document.getElementById("fullscreen").onclick = () => { stage.requestFullscreen?.().catch(() => {}); canvas.focus(); };

  function stored(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function store(key, value) { try { localStorage.setItem(key, value); } catch (e) { /* no storage */ } }
  const pageParams = new URLSearchParams(location.search);

  // The game's size. Options has "Auto" by default (also for players who picked a size before it
  // existed): the game area in the screen's real pixels (devicePixelRatio), so the picture is drawn
  // 1:1 instead of stretched, at most the quality's pixel budget (PC, phones). Never below 640x480,
  // the game's smallest screen, nor below half a pixel per CSS pixel. Picking a size in Options turns
  // "Auto" off. The game follows muDisplay once a frame (Winmain.cpp MuWebFollowPageSize) and draws
  // its interface `ratio` times larger, as on a desktop display set to 125 or 150 %.
  // index.html?q=high|medium|low picks the quality (kept, like the footer's choice); ?dpr=N stands
  // in for the screen's ratio.
  const QUALITY_BUDGETS = { high: [2560 * 1440, 1.5e6], medium: [1920 * 1080, 0.75e6], low: [1280 * 720, 0.4e6] };
  const MIN_GAME_SIZE = [640, 480];
  const MIN_PIXEL_RATIO = 0.5;
  const MAX_TEXTURE_SIZE = 8192; // WebGPU's default maxTextureDimension2D
  const phone = navigator.userAgentData ? navigator.userAgentData.mobile : /Android|iPhone|iPad/.test(navigator.userAgent);
  if (pageParams.has("reset")) {
    try { localStorage.removeItem("mu-web/resolution"); localStorage.removeItem("mu-web/quality"); } catch (e) {}
  }
  if (QUALITY_BUDGETS[pageParams.get("q")]) store("mu-web/quality", pageParams.get("q"));
  const display = window.muDisplay = {
    auto: stored("mu-web/resolution") !== "manual",
    quality: QUALITY_BUDGETS[stored("mu-web/quality")] ? stored("mu-web/quality") : "high",
    width: 0, height: 0, ratio: 1, serial: 0,
    setAuto(enabled) {
      this.auto = enabled;
      store("mu-web/resolution", enabled ? "auto" : "manual");
      updateDisplay();
    },
    setQuality(quality) {
      if (!QUALITY_BUDGETS[quality]) return;
      this.quality = quality;
      store("mu-web/quality", quality);
      updateDisplay();
    },
  };
  // The stage's exact size in device pixels, where the browser tells it (Chrome, Edge, Firefox).
  let stageDevicePixels = null;

  function updateDisplay() {
    const area = stage.getBoundingClientRect();
    if (area.width < 1 || area.height < 1) return; // hidden: keep the last size
    const screenRatio = Number(pageParams.get("dpr")) || window.devicePixelRatio || 1;
    const budget = QUALITY_BUDGETS[display.quality][phone ? 1 : 0];
    let ratio = Math.min(screenRatio, Math.sqrt(budget / (area.width * area.height)));
    ratio = Math.max(ratio, MIN_PIXEL_RATIO, MIN_GAME_SIZE[0] / area.width, MIN_GAME_SIZE[1] / area.height);
    ratio = Math.min(ratio, MAX_TEXTURE_SIZE / area.width, MAX_TEXTURE_SIZE / area.height);
    let width = Math.round(area.width * ratio), height = Math.round(area.height * ratio);
    if (ratio === window.devicePixelRatio && stageDevicePixels) [width, height] = stageDevicePixels;
    width = Math.max(width, MIN_GAME_SIZE[0]);
    height = Math.max(height, MIN_GAME_SIZE[1]);
    if (width !== display.width || height !== display.height || ratio !== display.ratio) {
      Object.assign(display, { width, height, ratio, serial: display.serial + 1 });
    }
    fitCanvas();
  }

  // The canvas has the game's resolution (its width and height attributes) and is shown as large as
  // the stage allows, keeping its shape. Only the CSS size changes, which SDL takes into account for
  // the mouse. With "Auto" it is exactly width / ratio CSS pixels: a size rounded to whole CSS pixels
  // would stretch it by a fraction and blur it again. Not before the game has sized the canvas (away
  // from the HTML default of 300x150): SDL treats a canvas the page already sized as one it may not
  // resize.
  function fitCanvas() {
    const w = canvas.width, h = canvas.height;
    if (w <= 1 || h <= 1 || (w === 300 && h === 150) || !stage.clientWidth || !stage.clientHeight) return;
    const area = stage.getBoundingClientRect();
    const exact = display.auto && w === display.width && h === display.height;
    stage.classList.toggle("auto", exact);
    let cssW, cssH;
    if (exact) {
      // Smaller only where the 640x480 floor made the game bigger than the stage.
      const fit = Math.min(1, (area.width * display.ratio + 1) / w, (area.height * display.ratio + 1) / h);
      cssW = w / display.ratio * fit + "px";
      cssH = h / display.ratio * fit + "px";
    } else {
      const scale = Math.min(stage.clientWidth / w, stage.clientHeight / h);
      cssW = Math.floor(w * scale) + "px";
      cssH = Math.floor(h * scale) + "px";
    }
    if (canvas.style.width !== cssW) canvas.style.width = cssW;
    if (canvas.style.height !== cssH) canvas.style.height = cssH;
  }

  const stageObserver = new ResizeObserver((entries) => {
    const box = entries[0].devicePixelContentBoxSize && entries[0].devicePixelContentBoxSize[0];
    stageDevicePixels = box ? [box.inlineSize, box.blockSize] : null;
    updateDisplay();
  });
  try {
    stageObserver.observe(stage, { box: "device-pixel-content-box" });
  } catch (e) {
    stageObserver.observe(stage);
  }
  // Browser zoom and moving the window to another screen change devicePixelRatio.
  (function watchPixelRatio() {
    matchMedia(`(resolution: ${window.devicePixelRatio}dppx)`)
      .addEventListener("change", () => { updateDisplay(); watchPixelRatio(); }, { once: true });
  })();
  new MutationObserver(fitCanvas).observe(canvas, { attributes: true, attributeFilter: ["width", "height", "style"] });
  updateDisplay();

  const qualitySelect = document.getElementById("quality");
  qualitySelect.value = display.quality;
  qualitySelect.onchange = () => { display.setQuality(qualitySelect.value); canvas.focus(); };

  // When the game's code fails (a WebAssembly error), say so and stop calling into it. The failure
  // can leave a lock taken (inside malloc, say), and the next call from the page (saving settings,
  // a key, a network message) would wait for it forever and freeze the tab.
  let crashed = false;
  const openSockets = new Set();
  const PageWebSocket = WebSocket;
  window.WebSocket = class extends PageWebSocket {
    constructor(...args) {
      super(...args);
      openSockets.add(this);
      this.addEventListener("close", () => openSockets.delete(this));
    }
  };
  const blockAfterCrash = (event) => { if (crashed) event.stopImmediatePropagation(); };
  for (const type of ["keydown", "keyup", "keypress", "mousedown", "mouseup", "mousemove", "wheel", "pointerdown",
                      "pointerup", "pointermove", "touchstart", "touchend", "touchmove", "focus", "blur", "resize",
                      "visibilitychange", "contextmenu"]) {
    window.addEventListener(type, blockAfterCrash, true);
  }
  function gameCrashed(error) {
    if (crashed) return;
    crashed = true;
    for (const socket of openSockets) {
      socket.onmessage = socket.onclose = socket.onerror = null;
      try { socket.close(); } catch (e) {}
    }
    statusEl.hidden = false;
    statusEl.classList.add("bad");
    statusEl.style.pointerEvents = "auto";
    statusEl.style.background = "rgba(13,14,18,.92)";
    statusEl.innerHTML = "";
    const box = document.createElement("div");
    box.innerHTML = "<p>The game stopped because of an error.</p><p></p>";
    box.lastChild.textContent = String(error && error.message || error).slice(0, 300);
    const reload = document.createElement("button");
    reload.textContent = "Reload";
    reload.onclick = () => location.reload();
    const reset = document.createElement("button");
    reset.textContent = "Reset settings and reload";
    reset.onclick = () => { location.search = "?reset"; };
    for (const button of [reload, reset]) {
      button.style.cssText = "font: inherit; margin: .25rem; padding: .3rem .8rem; cursor: pointer;";
      box.appendChild(button);
    }
    statusEl.appendChild(box);
    console.error("The game stopped:", error);
  }
  // Leaving the page can keep it frozen in Chrome's back/forward cache with its sockets open, and
  // the browser still answers the bridge's pings, so the character stayed "already connected"
  // until OpenMU's own timeout. Close them when the page goes, and start over if it comes back.
  addEventListener("pagehide", () => {
    for (const socket of openSockets) {
      try { socket.close(1000, "page closed"); } catch (e) {}
    }
  });
  addEventListener("pageshow", (event) => { if (event.persisted) location.reload(); });

  const isGameError = (error) => error instanceof WebAssembly.RuntimeError || /Main\.wasm/.test(String(error && error.stack));
  addEventListener("error", (event) => { if (isGameError(event.error)) gameCrashed(event.error); });
  addEventListener("unhandledrejection", (event) => { if (isGameError(event.reason)) gameCrashed(event.reason); });

  // config.ini (resolution, volume, the remembered user name ...) lives in the page's memory; keep
  // a copy in the browser so the next visit starts with it (WebFileSystem.cpp merges it back).
  // index.html?reset forgets it (and the resolution and quality choices, above), for a setting that
  // keeps the game from starting.
  if (new URLSearchParams(location.search).has("reset")) {
    try { localStorage.removeItem("mu-web/config.ini"); } catch (e) {}
  }
  // Browser players start at 60 frames a second (the server's config.ini, scripts/publish-web.py):
  // uncapped, the game's own default, stuttered for a player (2026-10-24). Once per browser, a saved
  // copy that still has the old default (-1, uncapped) gets 60 too; a cap chosen in Options stays.
  try {
    if (localStorage.getItem("mu-web/fps-default") !== "60") {
      const saved = localStorage.getItem("mu-web/config.ini");
      if (saved && /^FpsCap=-1\r?$/m.test(saved)) {
        localStorage.setItem("mu-web/config.ini", saved.replace(/^FpsCap=-1(\r?)$/m, "FpsCap=60$1"));
      }
      localStorage.setItem("mu-web/fps-default", "60");
    }
  } catch (e) { /* no storage in this browser */ }
  let savedConfig = null;
  function saveConfig() {
    if (crashed) return;
    try {
      const text = new TextDecoder().decode(Module.FS.readFile("/game/config.ini"));
      if (text && text !== savedConfig) {
        localStorage.setItem("mu-web/config.ini", text);
        savedConfig = text;
      }
    } catch (e) { /* not mounted yet, or no storage in this browser */ }
  }

  // The game needs WebGPU (graphics), JSPI (its frame loop yields to the browser) and cross-origin
  // isolation (threads). Say which one is missing instead of failing somewhere inside the game.
  const missing = [];
  if (!navigator.gpu) missing.push("WebGPU");
  if (!("Suspending" in WebAssembly)) missing.push("WebAssembly JSPI");
  if (!self.crossOriginIsolated) missing.push("cross-origin isolation (serve with scripts/serve-web.py)");
  // The graphics adapter and the optional WebGPU features SDL's WebGPU backend requires. Without one
  // of them the game only said "SDL_gpu Renderer Error. Install the latest graphics card driver." (an
  // AMD Radeon RX 9070 XT, 2026-10-24; its browser then gave no adapter at all).
  // index.html?needfeature=<name> adds a feature and ?noadapter drops the adapter, to see the messages.
  const NEEDED_FEATURES = ["depth32float-stencil8", "rg11b10ufloat-renderable", "indirect-first-instance",
                           "depth-clip-control", "bgra8unorm-storage", "float32-filterable"];
  // The game's shaders use clip distances where the card has them. ARM Mali phones (a Pixel 9 Pro XL,
  // 2026-10-29) don't, and the game takes its soft clip shaders instead (Module.muClipDistances,
  // Core/Platform/web/WebGpuFeatures.cpp). index.html?softclip takes them on any card, to try them.
  const CLIP_DISTANCES = "clip-distances";
  // The browser and its version, for the message: Yandex, Opera and Brave are Chromium too, and some
  // give pages navigator.gpu but no adapter.
  function browserName() {
    const brands = ((navigator.userAgentData && navigator.userAgentData.brands) || [])
      .filter((b) => !/brand|chromium/i.test(b.brand)).map((b) => b.brand + " " + b.version);
    const tokens = navigator.userAgent.match(/(YaBrowser|OPR|Edg|Vivaldi|Firefox)\/[\d.]+/g) || [];
    return brands.concat(tokens).join(", ") || navigator.userAgent;
  }
  async function checkGpu() {
    const params = new URLSearchParams(location.search);
    const needed = NEEDED_FEATURES.concat(params.getAll("needfeature"));
    // The game asks for the high-performance adapter; the others only tell whether the browser has
    // any adapter at all (2026-10-24: an RX 9070 XT got none).
    const tried = [];
    let adapter = null;
    for (const powerPreference of ["high-performance", "low-power", undefined]) {
      let found = null;
      try { found = await navigator.gpu.requestAdapter(powerPreference ? { powerPreference } : undefined); } catch (e) {}
      if (params.has("noadapter")) found = null;   // index.html?noadapter shows that message
      tried.push(`${powerPreference || "default"}: ${found ? "yes" : "no"}`);
      adapter = adapter || found;
    }
    const browser = browserName();
    if (!adapter) {
      appendLog(`WebGPU: the browser gave no graphics adapter (${tried.join(", ")}); browser: ${browser}`, true);
      return { ok: false, gpu: "none", browser, missing: [] };
    }
    const info = adapter.info || {};
    const gpu = [info.vendor, info.architecture, info.device, info.description].filter(Boolean).join(" / ") || "unknown";
    const missing = needed.filter((name) => !adapter.features.has(name));
    const clipDistances = adapter.features.has(CLIP_DISTANCES) && !params.has("softclip");
    appendLog(`WebGPU adapter: ${gpu} (${tried.join(", ")}); missing features: ${missing.join(", ") || "none"}; ` +
              `clip distances: ${clipDistances ? "yes" : "no, soft clip shaders"}; browser: ${browser}`,
              missing.length > 0);
    return { ok: missing.length === 0, gpu, browser, missing, clipDistances };
  }
  function showGpuProblem(gpu, browser, missingFeatures) {
    const lines = missingFeatures.length
      ? ["Your graphics card can't run the game in this browser yet.",
         "Missing WebGPU features: " + missingFeatures.join(", "),
         "Update the graphics driver and Chrome or Edge, then reload this page.",
         "",
         "Видеокарта пока не может запустить игру в этом браузере.",
         "Обновите драйвер видеокарты и Chrome или Edge, затем обновите страницу."]
      : ["The browser gives this page no graphics card (WebGPU). To fix it:",
         "1. Use Google Chrome or Microsoft Edge (not Yandex, Opera or Brave).",
         "2. Settings → System: turn on \"Use graphics acceleration when available\", restart the browser.",
         "3. Update the graphics driver (AMD Adrenalin, NVIDIA, Intel).",
         "4. If it still fails: open chrome://flags/#enable-unsafe-webgpu, set Enabled, restart the browser.",
         "Then reload this page. Still failing: send a screenshot of chrome://gpu.",
         "",
         "Браузер не даёт странице видеокарту (WebGPU). Как исправить:",
         "1. Откройте игру в Google Chrome или Microsoft Edge (не в Яндексе, Opera или Brave).",
         "2. Настройки → Система: включите «Использовать графическое ускорение», перезапустите браузер.",
         "3. Обновите драйвер видеокарты (AMD Adrenalin, NVIDIA, Intel).",
         "4. Если не помогло: откройте chrome://flags/#enable-unsafe-webgpu, выберите Enabled, перезапустите браузер.",
         "Затем обновите эту страницу. Если всё равно не работает, пришлите снимок страницы chrome://gpu."];
    lines.push("", "GPU: " + gpu + " · Browser: " + browser);
    canvas.style.display = "none";
    statusEl.style.whiteSpace = "pre-line";
    setStatus(lines.join("\n"), true);
  }

  if (missing.length) {
    setStatus("This browser can't run the game: no " + missing.join(", ") + ". Use a current Chrome or Edge.", true);
  } else checkGpu().then((gpuCheck) => {
    if (!gpuCheck.ok) {
      showGpuProblem(gpuCheck.gpu, gpuCheck.browser, gpuCheck.missing);
      return;
    }
    // index.html?profile samples the page's code (JS Self-Profiling API; the server must send
    // "Document-Policy: js-profiling", as scripts/serve-web.py does). muProfileTop() in the console
    // lists the functions that took the most time since the page opened.
    if (new URLSearchParams(location.search).has("profile") && self.Profiler) {
      const profiler = new Profiler({ sampleInterval: 10, maxBufferSize: 1000000 });
      window.muProfileTop = async (count = 40) => {
        const trace = await profiler.stop();
        const selfCounts = new Map(), totalCounts = new Map();
        for (const sample of trace.samples) {
          const seen = new Set();
          for (let id = sample.stackId, first = true; id !== undefined; id = trace.stacks[id].parentId, first = false) {
            const frame = trace.frames[trace.stacks[id].frameId];
            const name = frame.name || "(anonymous)";
            if (first) selfCounts.set(name, (selfCounts.get(name) || 0) + 1);
            if (!seen.has(name)) { seen.add(name); totalCounts.set(name, (totalCounts.get(name) || 0) + 1); }
          }
        }
        const top = (map) => [...map].sort((a, b) => b[1] - a[1]).slice(0, count).map(([n, c]) => `${(c * 10 / 1000).toFixed(1)}s ${n}`);
        return { samples: trace.samples.length, self: top(selfCounts), total: top(totalCounts) };
      };
    }

    // index.html?heartbeat logs every 2 s how often timers and animation frames got a turn, to see
    // whether the game leaves the browser any time between its frames.
    if (new URLSearchParams(location.search).has("heartbeat")) {
      let frames = 0, last = performance.now();
      const countFrame = () => { frames++; requestAnimationFrame(countFrame); };
      requestAnimationFrame(countFrame);
      setInterval(() => {
        const now = performance.now();
        console.log(`heartbeat: ${Math.round(now - last)} ms since the last one, ${frames} animation frames`);
        last = now; frames = 0;
      }, 2000);
    }

    // The files the game reads before it can be played come in one download (startup.pack, listed in
    // startup.json), fetched while the game's code loads. WebFileSystem.cpp waits for it; without it
    // the game fetches each file when it first opens it.
    let packDone = false;
    const startupPack = (async () => {
      const indexResponse = await fetch("startup.json", { cache: "no-cache" });
      if (!indexResponse.ok) return null;
      const index = await indexResponse.json();
      const total = index.files.reduce((sum, file) => sum + file[1], 0);
      const response = await fetch("startup.pack", { cache: "no-cache" });
      if (!response.ok) return null;
      const bytes = new Uint8Array(total);
      const reader = response.body.getReader();
      let received = 0, shownMb = -1;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        if (received + value.length > total) throw new Error("startup.pack is bigger than startup.json says");
        bytes.set(value, received);
        received += value.length;
        const mb = Math.floor(received / 1e6);
        if (mb !== shownMb) {
          shownMb = mb;
          setStatus(`Downloading game data… ${mb} of ${Math.round(total / 1e6)} MB`);
        }
      }
      if (received !== total) throw new Error("startup.pack is incomplete");
      return { files: index.files, bytes };
    })().finally(() => { packDone = true; setStatus(""); });

    // Global for Main.js, which picks up an existing Module object.
    window.Module = {
      canvas,
      muStartupPack: startupPack,
      muClipDistances: gpuCheck.clipDistances,
      print: (text) => { console.log(text); appendLog(text, false); },
      printErr: (text) => { console.error(text); appendLog(text, true); },
      setStatus: (text) => { if (packDone || text) setStatus(text); },
      onRuntimeInitialized: () => {
        if (packDone) setStatus("");
        canvas.focus();
        setInterval(saveConfig, 3000);
        addEventListener("pagehide", saveConfig);
      },
      onAbort: (what) => gameCrashed(what),
    };
    const script = document.createElement("script");
    script.src = "Main.js";
    script.onerror = () => setStatus("Main.js didn't load: is the web build in this folder?", true);
    document.body.appendChild(script);
  });
</script>
</body>
</html>
