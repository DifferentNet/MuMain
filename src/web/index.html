<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=resizes-visual">
<meta name="theme-color" content="#0d0e12">
<link rel="manifest" href="manifest.webmanifest">
<title>MU Online (web)</title>
<script>
  // What the game runs on, decided before the page is drawn, so nothing jumps: a phone, a tablet or a
  // computer. Phones and tablets are played with the fingers: they get the touch page (html.phone: the
  // game fills the screen in landscape, the footer opens from the menu button, the device's own
  // keyboard for text fields), and the game knows it from its first frame (Module.muDevice,
  // Core/Platform/web/WebDevice.cpp) for its touch controls. index.html?phone, ?tablet or ?desktop
  // decides it on any device. "reason" goes to the log.
  // A tablet's or a "desktop site" phone's browser may call itself a computer; a touch screen with
  // no mouse at all gives it away, and the screen's short side tells a phone from a tablet.
  const TABLET_SHORT_SIDE = 600;   // CSS pixels: below it, a phone
  function detectDevice() {
    const params = new URLSearchParams(location.search);
    for (const kind of ["phone", "tablet", "desktop"]) {
      if (params.has(kind)) return { kind, reason: "?" + kind };
    }
    const ua = navigator.userAgent;
    if (navigator.userAgentData && navigator.userAgentData.mobile) return { kind: "phone", reason: "the browser says mobile" };
    if (/iPhone|iPod|Android.+Mobile/.test(ua)) return { kind: "phone", reason: "user agent" };
    if (/iPad|Android/.test(ua)) return { kind: "tablet", reason: "user agent" };
    // iPadOS Safari calls itself a Mac, and Macs have no touch screens.
    if (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) return { kind: "tablet", reason: "a Mac with a touch screen" };
    const touchOnly = navigator.maxTouchPoints > 0 && matchMedia("(any-pointer: coarse)").matches &&
      !matchMedia("(any-pointer: fine)").matches && !matchMedia("(any-hover: hover)").matches;
    if (touchOnly) {
      const kind = Math.min(screen.width, screen.height) < TABLET_SHORT_SIDE ? "phone" : "tablet";
      return { kind, reason: "a touch screen and no mouse" };
    }
    return { kind: "desktop", reason: "a mouse, or no touch screen" };
  }
  const device = detectDevice();
  const phone = device.kind !== "desktop";   // phones and tablets: the touch page
  document.documentElement.classList.toggle("phone", phone);
</script>
<style>
  :root { --bg: #0d0e12; --panel: #16181f; --line: rgba(255,255,255,.12); --ink: #f2eee6; --muted: #a0a5b1; --gold: #e5b95c; --bad: #f2766a; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.5 "Segoe UI", system-ui, sans-serif; }
  #stage { display: flex; align-items: center; justify-content: center; height: calc(100% - 2.5rem); overflow: hidden; }
  #stage:fullscreen { height: 100%; background: #000; }
  /* "Auto": the canvas is the stage's size to the device pixel; at its corner, half a pixel off would blur it. */
  #stage.auto { align-items: flex-start; justify-content: flex-start; }
  /* fitCanvas() below sizes the canvas to the stage; the game picks its resolution (Options, "Auto" by default). */
  #canvas { display: block; flex: none; background: #000; outline: none; }
  #status { position: absolute; inset: 0 0 2.5rem 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 1rem; pointer-events: none; }
  #status.bad { color: var(--bad); }
  #status[hidden] { display: none; }
  footer { height: 2.5rem; display: flex; gap: 1rem; align-items: center; padding: 0 1rem; border-top: 1px solid var(--line); background: var(--panel); color: var(--muted); font-size: .8125rem; }
  footer button { font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 4px; padding: .15rem .6rem; cursor: pointer; }
  footer select { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: .1rem .3rem; }
  footer label { white-space: nowrap; }
  /* Phones: the buttons and the quality choice fit on one line without the title. */
  @media (max-width: 520px) { footer { gap: .5rem; padding: 0 .5rem; } footer > span { display: none; } }
  footer button:focus-visible, footer select:focus-visible { outline: 2px solid var(--gold); }
  #log { position: fixed; left: 0; right: 0; bottom: 2.5rem; height: 40%; margin: 0; padding: .5rem 1rem; overflow: auto; background: rgba(13,14,18,.96); border-top: 1px solid var(--line); font: 12px/1.4 ui-monospace, Consolas, monospace; white-space: pre-wrap; }
  #log[hidden] { display: none; }
  .err { color: var(--bad); }
  /* Phones: no footer line; the menu button in the corner opens its buttons as a panel, and nothing
     scrolls, zooms, selects or flashes under the player's fingers. */
  #menu, #play, #rotate { display: none; }
  html.phone, html.phone body { height: 100dvh; overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  html.phone #stage { height: 100%; }
  html.phone #canvas { touch-action: none; }
  html.phone #status { inset: 0; }
  html.phone #log { bottom: 0; }
  html.phone #menu { display: block; position: fixed; top: .5rem; right: .5rem; z-index: 2; width: 3rem; height: 3rem; padding: 0; border: 1px solid var(--line); border-radius: 50%; background: rgba(22,24,31,.6); color: var(--ink); font-size: 1.25rem; line-height: 1; cursor: pointer; }
  html.phone footer { position: fixed; top: .5rem; right: 4rem; z-index: 2; height: auto; flex-direction: column; align-items: stretch; gap: .5rem; padding: .75rem; border: 1px solid var(--line); border-radius: 6px; }
  html.phone footer:not(.open), html.phone footer > span { display: none; }
  html.phone footer button, html.phone footer select { padding: .45rem .9rem; }
  /* Phones, before the game: Play opens it fullscreen and sideways. */
  html.phone #play.show { display: flex; position: fixed; left: 50%; bottom: 1rem; transform: translateX(-50%); z-index: 3; flex-direction: column; align-items: center; gap: .35rem; padding: .75rem 1.25rem; border: 1px solid var(--line); border-radius: 8px; background: rgba(22,24,31,.94); }
  #play-fullscreen { font: inherit; font-size: 1.125rem; font-weight: 600; color: #1b1406; background: var(--gold); border: 0; border-radius: 6px; padding: .6rem 2.25rem; cursor: pointer; }
  #play-here { font: inherit; font-size: .8125rem; color: var(--muted); background: none; border: 0; padding: .25rem; text-decoration: underline; cursor: pointer; }
  #install { font: inherit; font-size: 1rem; font-weight: 600; color: var(--gold); background: transparent; border: 1px solid var(--gold); border-radius: 6px; padding: .45rem 1.5rem; cursor: pointer; }
  #play-fullscreen[hidden], #install[hidden], footer button[hidden], #install-hint[hidden] { display: none; }
  /* Where the browser has no Install of its own to offer: the steps in its menu. */
  #install-hint { position: fixed; left: 50%; bottom: 1rem; transform: translateX(-50%); z-index: 5; width: min(28rem, calc(100% - 2rem)); padding: .9rem 1.1rem; border: 1px solid var(--gold); border-radius: 8px; background: rgba(22,24,31,.97); text-align: center; white-space: pre-line; }
  #install-hint p { margin: 0 0 .6rem; }
  #install-hint button { font: inherit; font-weight: 600; color: #1b1406; background: var(--gold); border: 0; border-radius: 6px; padding: .35rem 1.75rem; cursor: pointer; }
  /* Phones held upright: the game is played sideways. */
  #rotate { position: fixed; inset: 0; z-index: 4; align-items: center; justify-content: center; padding: 1rem; text-align: center; background: var(--bg); }
  @media (orientation: portrait) { html.phone #rotate { display: flex; } }
  #rotate-icon { width: 2.5rem; height: 4.25rem; margin: 0 auto 1.25rem; border: 3px solid var(--gold); border-radius: .5rem; animation: turn-phone 2s ease-in-out infinite; }
  @keyframes turn-phone { 0%, 25% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  @media (prefers-reduced-motion: reduce) { #rotate-icon { animation: none; transform: rotate(-90deg); } }
  /* Phones: the unseen field that brings up the phone's keyboard for the game's text fields
     (phoneKeyboard below). 16px, or an iPhone zooms in on it. */
  #keyboard { position: fixed; left: 0; top: 0; width: 1px; height: 1px; padding: 0; border: 0; opacity: 0; font-size: 16px; pointer-events: none; caret-color: transparent; -webkit-user-select: text; user-select: text; }
</style>
</head>
<body>
<div id="stage"><canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas></div>
<input id="keyboard" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" tabindex="-1" aria-hidden="true">
<div id="status">Loading…</div>
<pre id="log" hidden></pre>
<button id="menu" type="button" aria-label="Menu" title="Menu">⋮</button>
<div id="play">
  <button id="play-fullscreen" type="button">Play</button>
  <button id="install" type="button" hidden>Install the game · Установить игру</button>
  <button id="play-here" type="button">Stay in the browser · Остаться в браузере</button>
</div>
<div id="install-hint" role="dialog" aria-label="Install" hidden><p></p><button type="button">OK</button></div>
<div id="rotate"><div><div id="rotate-icon"></div>Turn your phone sideways<br>Поверните телефон горизонтально</div></div>
<footer>
  <span>MU Online in the browser</span>
  <button id="toggle-log" type="button">Log</button>
  <button id="fullscreen" type="button">Fullscreen</button>
  <button id="install-menu" type="button" hidden>Install</button>
  <button id="view" type="button" hidden title="The game's layout, as in its Options → Interface">View</button>
  <label title="How many pixels the game draws while Options has Auto resolution">Quality
    <select id="quality">
      <option value="high">High</option>
      <option value="medium">Medium</option>
      <option value="low">Low</option>
    </select>
  </label>
</footer>
<script>
  const statusEl = document.getElementById("status");
  const logEl = document.getElementById("log");
  const canvas = document.getElementById("canvas");
  const playCard = document.getElementById("play");
  function setStatus(text, bad) {
    statusEl.hidden = !text;
    statusEl.textContent = text || "";
    statusEl.classList.toggle("bad", !!bad);
    if (bad) playCard.classList.remove("show");
  }
  // The log keeps its last LOG_LINES lines and, for good, the first KEPT_ERRORS error lines. A line
  // equal to the one before it only counts up. Past ERRORS_PER_SECOND error lines in a second the rest
  // are only counted, and a line says how many. A browser that can't compile a shader can repeat the
  // error on every frame: on a Mac's Safari that pushed the first error out of the log and froze the
  // page (2026-10-29). Returns false for a line left out.
  const LOG_LINES = 3000, KEPT_ERRORS = 200, ERRORS_PER_SECOND = 50;
  let errorLines = 0, errorsThisSecond = 0, errorsLeftOut = 0, errorSecondTimer = 0, logScroll = 0;
  function newErrorSecond() {
    errorSecondTimer = 0;
    errorsThisSecond = 0;
    if (errorsLeftOut) {
      const count = errorsLeftOut;
      errorsLeftOut = 0;
      addLogLine(`(${count} more error lines left out)`, true);
    }
  }
  function addLogLine(text, isError) {
    const line = document.createElement("div");
    if (isError) {
      line.className = "err";
      if (errorLines++ < KEPT_ERRORS) line.dataset.keep = "1";
    }
    line.dataset.text = text;
    line.textContent = text;
    logEl.appendChild(line);
    if (logEl.childElementCount > LOG_LINES) {
      let oldest = logEl.firstElementChild;
      while (oldest && oldest.dataset.keep) oldest = oldest.nextElementSibling;
      if (oldest) oldest.remove();
    }
    if (!logScroll) logScroll = requestAnimationFrame(() => { logScroll = 0; logEl.scrollTop = logEl.scrollHeight; });
    return line;
  }
  function appendLog(text, isError) {
    const last = logEl.lastElementChild;
    if (last && last.dataset.text === text) {
      last.dataset.count = String(Number(last.dataset.count || 1) + 1);
      last.textContent = `${text} (×${last.dataset.count})`;
      return true;
    }
    if (isError) {
      if (!errorSecondTimer) errorSecondTimer = setTimeout(newErrorSecond, 1000);
      if (++errorsThisSecond > ERRORS_PER_SECOND && errorLines >= KEPT_ERRORS) {
        errorsLeftOut++;
        return false;
      }
    }
    addLogLine(text, isError);
    return true;
  }
  // WebGPU errors whole, each different one once. SDL prints an error as many log lines, and WebKit's
  // shader errors carry the whole generated Metal code with the reason last: with a long shader the
  // reason fell past the kept error lines and the per-second limit (Safari, 2026-10-29). The page
  // listens on the game's device itself: one kept line per different error, reason included, a count
  // for repeats, and the lines SDL prints for it left out. muGpuErrors() in the browser console gives
  // the errors whole: copy(muGpuErrors()).
  const GPU_ERRORS_KEPT = 20, GPU_ECHO_MS = 1000;
  const gpuErrors = new Map();   // message -> { count, summary, line }
  let gpuErrorText = "", gpuEchoUntil = 0;
  function gpuErrorSummary(message) {
    // WebKit: "Failed to compile the shader source, generated metal:\n<Metal code> - error <reason>"
    const reasonAt = message.lastIndexOf(" - error ");
    const firstLineEnd = message.indexOf("\n");
    const text = reasonAt >= 0 && firstLineEnd >= 0
      ? `${message.slice(0, firstLineEnd)} … ${message.slice(reasonAt + 3)}` : message;
    return "WebGPU error: " + text.replace(/\s+/g, " ").trim().slice(0, 1500);
  }
  function onGpuError(event) {
    const message = String((event.error && event.error.message) || "unknown");
    const seen = gpuErrors.get(message);
    if (!seen && gpuErrors.size >= GPU_ERRORS_KEPT) return;   // SDL's lines go to the log as before
    gpuErrorText = message;
    gpuEchoUntil = performance.now() + GPU_ECHO_MS;
    if (seen) {
      seen.count++;
      seen.line.textContent = `${seen.summary} (×${seen.count})`;
      return;
    }
    const summary = gpuErrorSummary(message);
    const line = addLogLine(summary, true);
    line.dataset.keep = "1";
    gpuErrors.set(message, { count: 1, summary, line });
    console.error(message);
  }
  // A line SDL prints for the error onGpuError just took: "ERROR: WebGPU uncaptured error!", then the
  // message line by line (the [sdl] log the same way).
  function gpuErrorEcho(text) {
    if (performance.now() > gpuEchoUntil) return false;
    return /WebGPU uncaptured error!$/.test(text) || gpuErrorText.includes(text.replace(/^ERROR: /, ""));
  }
  if (self.GPUAdapter) {
    const requestDevice = GPUAdapter.prototype.requestDevice;
    GPUAdapter.prototype.requestDevice = function (...args) {
      return requestDevice.apply(this, args).then((gpuDevice) => {
        gpuDevice.addEventListener("uncapturederror", onGpuError);
        return gpuDevice;
      });
    };
  }
  window.muGpuErrors = () =>
    [...gpuErrors].map(([message, e]) => `(×${e.count}) ${message}`).join("\n\n") || "no WebGPU errors";
  document.getElementById("toggle-log").onclick = () => { logEl.hidden = !logEl.hidden; };
  appendLog(`Device: ${device.kind} (${device.reason}); screen ${screen.width}x${screen.height} CSS px, ` +
            `${devicePixelRatio} device px each, ${navigator.maxTouchPoints} touch points`);
  const stage = document.getElementById("stage");
  const footer = document.querySelector("footer");
  // Phones put the whole page on the screen, the menu button too, and turn it sideways: browsers lock
  // the orientation only in fullscreen. Called from a tap, as fullscreen needs one. The footer's
  // button also leaves fullscreen. A browser that refuses says why in the log and for a moment on the
  // screen: on a Pixel's Edge the button did nothing at all (2026-10-29).
  const FULLSCREEN_NOTE_MS = 4000;
  const fullscreenButton = document.getElementById("fullscreen");
  let fullscreenNoteTimer = 0;
  function inFullscreen() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function fullscreenRefused(reason) {
    const text = "Fullscreen refused: " + (reason && reason.message ? reason.message : String(reason));
    appendLog(text, true);
    if (!statusEl.hidden && !fullscreenNoteTimer) return; // "Loading…" and the like stay
    setStatus(text);
    clearTimeout(fullscreenNoteTimer);
    fullscreenNoteTimer = setTimeout(() => { fullscreenNoteTimer = 0; setStatus(""); }, FULLSCREEN_NOTE_MS);
  }
  function enterFullscreen() {
    const target = phone ? document.documentElement : stage;
    const request = target.requestFullscreen || target.webkitRequestFullscreen;
    if (!request) {
      fullscreenRefused("this browser has no fullscreen for pages");
      return;
    }
    let result;
    try {
      result = request.call(target, { navigationUI: "hide" });
    } catch (e) {
      fullscreenRefused(e);
      return;
    }
    Promise.resolve(result).then(() => {
      if (phone && screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(() => {});
    }, fullscreenRefused);
  }
  function leaveFullscreen() {
    const exit = document.exitFullscreen || document.webkitExitFullscreen;
    if (exit) Promise.resolve(exit.call(document)).catch(fullscreenRefused);
  }
  function showFullscreenState() {
    fullscreenButton.textContent = inFullscreen() ? "Leave fullscreen" : "Fullscreen";
    appendLog(inFullscreen() ? "Fullscreen" : "Fullscreen left");
  }
  document.addEventListener("fullscreenchange", showFullscreenState);
  document.addEventListener("webkitfullscreenchange", showFullscreenState);
  fullscreenButton.onclick = () => {
    if (inFullscreen()) leaveFullscreen();
    else enterFullscreen();
    footer.classList.remove("open");
    canvas.focus();
  };
  document.getElementById("menu").onclick = () => footer.classList.toggle("open");
  canvas.addEventListener("pointerdown", () => footer.classList.remove("open"));

  // View: the game's layout, Auto / PC / Phone, the same choice as its Options → Interface (Auto is
  // the phone layout on a phone or tablet, detectDevice). The game takes muView.request between
  // frames (Core/Platform/web/WebPageView.h) and calls show() with the choice in force, which also
  // shows the item once the game runs.
  const viewButton = document.getElementById("view");
  const VIEW_NAMES = [["Auto", "авто"], ["PC", "ПК"], ["Phone", "телефон"]];
  window.muView = {
    request: null,
    choice: 0,
    show(choice, phoneView) {
      if (!VIEW_NAMES[choice]) return;
      this.choice = choice;
      let [en, ru] = VIEW_NAMES[choice];
      if (choice === 0) {
        en += phoneView ? " (phone)" : " (PC)";
        ru += phoneView ? " (телефон)" : " (ПК)";
      }
      viewButton.textContent = "View: " + en + " · Вид: " + ru;
      viewButton.hidden = false;
    },
  };
  viewButton.onclick = () => {
    window.muView.request = (window.muView.choice + 1) % VIEW_NAMES.length;
    footer.classList.remove("open");
    canvas.focus();
  };

  // Phones: Play opens the game fullscreen; "Stay in the browser" keeps the address bar (the menu's
  // Fullscreen does it later); Install (below) puts it on the home screen. Not where the page already
  // fills the screen (opened from the home screen, manifest.webmanifest). An iPhone has no fullscreen
  // for pages: there the card offers Install, or playing in the browser.
  const homeScreenApp = matchMedia("(display-mode: fullscreen), (display-mode: standalone), (display-mode: minimal-ui)").matches;
  if (phone && !homeScreenApp) {
    const playButton = document.getElementById("play-fullscreen");
    const stayButton = document.getElementById("play-here");
    playButton.hidden = !(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
    if (playButton.hidden) stayButton.textContent = "Play in the browser · Играть в браузере";
    playCard.classList.add("show");
    playButton.onclick = () => { playCard.classList.remove("show"); enterFullscreen(); canvas.focus(); };
    stayButton.onclick = () => { playCard.classList.remove("show"); canvas.focus(); };
  }

  // Install: the game as an app on the home screen (or a computer's start menu), which opens it
  // fullscreen and sideways without the browser around it (manifest.webmanifest). Chrome and Edge
  // offer it to the page (beforeinstallprompt), and the Install buttons (the Play card, the menu) ask
  // the browser for it; where the browser offers nothing (an iPhone, Firefox, Samsung Internet, or
  // Chrome before it decided to), they show where the browser's own menu has it. Phones always show
  // them, computers only when the browser offers it, and nobody once the game runs as the app.
  const installButtons = [document.getElementById("install"), document.getElementById("install-menu")];
  const installHint = document.getElementById("install-hint");
  let installOffer = null;
  let installed = homeScreenApp;
  function showInstallButtons() {
    const shown = !installed && (phone || installOffer !== null);
    for (const button of installButtons) button.hidden = !shown;
  }
  function installSteps() {
    const ua = navigator.userAgent;
    if (/iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) {
      return "Tap Share (the square with an arrow), then “Add to Home Screen”.\n" +
             "Нажмите «Поделиться» (квадрат со стрелкой), затем «На экран „Домой“».";
    }
    if (/SamsungBrowser/.test(ua)) {
      return "Open the menu ≡, then “Add page to” → “Home screen”.\n" +
             "Откройте меню ≡, затем «Добавить страницу на» → «Главный экран».";
    }
    if (/Firefox/.test(ua)) {
      return "Open the menu ⋮, then “Install” or “Add to Home screen”.\n" +
             "Откройте меню ⋮, затем «Установить» или «Добавить на главный экран».";
    }
    return "Open the browser's menu (⋮ or …), then “Install app” or “Add to Home screen”.\n" +
           "Откройте меню браузера (⋮ или …), затем «Установить приложение» или «Добавить на главный экран».";
  }
  async function install() {
    footer.classList.remove("open");
    const offer = installOffer;
    if (!offer) {
      installHint.firstChild.textContent = installSteps();
      installHint.hidden = false;
      return;
    }
    installOffer = null;   // the browser's offer is good for one question
    try {
      await offer.prompt();
      appendLog(`Install: ${(await offer.userChoice).outcome}`);
    } catch (e) {
      appendLog(`Install: ${e}`, true);
    }
    showInstallButtons();
  }
  for (const button of installButtons) button.onclick = install;
  installHint.lastChild.onclick = () => { installHint.hidden = true; canvas.focus(); };
  addEventListener("beforeinstallprompt", (event) => {
    event.preventDefault();   // the page's own buttons instead of the browser's bar
    installOffer = event;
    showInstallButtons();
  });
  addEventListener("appinstalled", () => {
    installed = true;
    installOffer = null;
    installHint.hidden = true;
    showInstallButtons();
    appendLog("Installed: the game opens from the home screen now");
  });
  showInstallButtons();

  // Phones: their own keyboard for the game's text fields (Module.muKeyboard, called from
  // Core/Platform/web/WebKeyboard.cpp). A canvas can't bring it up, so while a field has the keys the
  // unseen #keyboard field has the page's focus, and what is typed there goes to the game as key
  // presses on the window, where SDL listens. A phone's keyboard gives no key codes, which SDL needs,
  // so the field's value says what changed. It starts with two zero-width spaces, so a Backspace
  // always has something to delete there, also when it is meant for text the game's field had before.
  // While the keyboard covers the game's field, the game moves up above it.
  const KEYBOARD_FILL = "​​";
  const KEYBOARD_MAX_LENGTH = 64;       // longer, and the field starts over between words
  const ENTER_HOLD_MS = 100;            // the login window reads Enter as a key held down
  const KEYBOARD_GAP = 12;              // CSS pixels between the game's field and the keyboard
  const KEYBOARD_HIDE_DELAY_MS = 100;   // from one field to the next the game hides it, then shows it
  const keyboardInput = document.getElementById("keyboard");
  let keyboardSent = KEYBOARD_FILL;     // the value the game has been sent
  let keyboardComposing = false;        // the keyboard is still writing a word (suggestions)
  let keyboardWanted = false;
  let keyboardHideTimer = 0;
  let keyboardLine = null;              // the game's field, [top, bottom] as fractions of its height
  let keyboardShift = 0;                // CSS pixels the game is moved up
  let tappedSinceKeyboard = false;      // a tap on the game since it last asked for the keyboard

  function pressKey(key, code, keyCode, holdMs) {

                      "visibilitychange", "contextmenu"]) {
    window.addEventListener(type, blockAfterCrash, true);
  }
  function gameCrashed(error) {
    if (crashed) return;
    crashed = true;
    playCard.classList.remove("show");
    for (const socket of openSockets) {
      socket.onmessage = socket.onclose = socket.onerror = null;
      try { socket.close(); } catch (e) {}
    }
    statusEl.hidden = false;
    statusEl.classList.add("bad");
    statusEl.style.pointerEvents = "auto";
    statusEl.style.background = "rgba(13,14,18,.92)";
    statusEl.innerHTML = "";
    const box = document.createElement("div");
    box.innerHTML = "<p>The game stopped because of an error.</p><p></p>";
    box.lastChild.textContent = String(error && error.message || error).slice(0, 300);
    const reload = document.createElement("button");
    reload.textContent = "Reload";
    reload.onclick = () => location.reload();
    const reset = document.createElement("button");
    reset.textContent = "Reset settings and reload";
    reset.onclick = () => { location.search = "?reset"; };

      button.style.cssText = "font: inherit; margin: .25rem; padding: .3rem .8rem; cursor: pointer;";

  // until OpenMU's own timeout. Close them when the page goes, and start over if it comes back.
  addEventListener("pagehide", () => {

  }

  // copy that still has the old default (-1, uncapped) gets 60 too; a cap chosen in Options stays.
  try {
    if (localStorage.getItem("mu-web/fps-default") !== "60") {

      if (saved && /^FpsCap=-1\r?$/m.test(saved)) {
        localStorage.setItem("mu-web/config.ini", saved.replace(/^FpsCap=-1(\r?)$/m, "FpsCap=60$1"));

  let savedConfig = null;
  function saveConfig() {
    if (crashed) return;
    try {
      const text = new TextDecoder().decode(Module.FS.readFile("/game/config.ini"));
      if (text && text !== savedConfig) {
        localStorage.setItem("mu-web/config.ini", text);
        savedConfig = text;
      }

  // clip shaders. Returns why it failed, or "" where it builds.
  const CLIP_TEST_SHADER = `enable clip_distances;
struct VertexOutput {
    @builtin(position) member: vec4<f32>,
    @location(0) member_1: vec2<f32>,
    @location(1) member_2: vec4<f32>,
    @location(2) member_3: f32,
    @location(3) member_4: f32,
    @builtin(clip_distances) member_5: array<f32, 1>,

var<private> clipDist: array<f32, 1> = array<f32, 1>();
@vertex
fn vs(@location(0) pos: vec3<f32>) -> VertexOutput {

fn fs(@location(0) uv: vec2<f32>) -> @location(0) vec4<f32> {

}`;

    const tried = [];

         "2. Настройки → Система: включите «Использовать графическое ускорение», перезапустите браузер.",
         "3. Обновите драйвер видеокарты (AMD Adrenalin, NVIDIA, Intel).",
         "4. Если не помогло: откройте chrome://flags/#enable-unsafe-webgpu, выберите Enabled, перезапустите браузер.",

    // lists the functions that took the most time since the page opened.
    if (new URLSearchParams(location.search).has("profile") && self.Profiler) {
      const profiler = new Profiler({ sampleInterval: 10, maxBufferSize: 1000000 });
      window.muProfileTop = async (count = 40) => {
        const trace = await profiler.stop();
        const selfCounts = new Map(), totalCounts = new Map();
        for (const sample of trace.samples) {
          const seen = new Set();
          for (let id = sample.stackId, first = true; id !== undefined; id = trace.stacks[id].parentId, first = false) {
            const frame = trace.frames[trace.stacks[id].frameId];
            const name = frame.name || "(anonymous)";
            if (first) selfCounts.set(name, (selfCounts.get(name) || 0) + 1);
            if (!seen.has(name)) { seen.add(name); totalCounts.set(name, (totalCounts.get(name) || 0) + 1); }
          }
        }
        const top = (map) => [...map].sort((a, b) => b[1] - a[1]).slice(0, count).map(([n, c]) => `${(c * 10 / 1000).toFixed(1)}s ${n}`);
        return { samples: trace.samples.length, self: top(selfCounts), total: top(totalCounts) };
      };
    }

    // index.html?heartbeat logs every 2 s how often timers and animation frames got a turn, to see
    // whether the game leaves the browser any time between its frames.
    if (new URLSearchParams(location.search).has("heartbeat")) {
      let frames = 0, last = performance.now();
      const countFrame = () => { frames++; requestAnimationFrame(countFrame); };
      requestAnimationFrame(countFrame);
      setInterval(() => {
        const now = performance.now();
        console.log(`heartbeat: ${Math.round(now - last)} ms since the last one, ${frames} animation frames`);
        last = now; frames = 0;
      }, 2000);
    }

    const releaseIndex = await releaseIndexLoad;
    // Main.js?v=<hash>: one version of the file, which the service worker keeps (sw.js).
    const code = (releaseIndex && releaseIndex.code) || {};
    const versioned = (name) => code[name] ? `${name}?v=${code[name]}` : name;

    // Main.wasm and the packs come as gzip copies (Main.wasm.gz, packs/*.pack.gz, written by
    // tools/web/make_startup_pack.py), which the page unpacks itself: the web server sends files as
    // they are, and a phone on a slow line waits for every megabyte (186 MB as they are, 120 packed,
    // 2026-10-29). A browser without DecompressionStream gets Main.wasm itself, and the game's files
    // one by one. Gives the response as it came over the network and whether its body is still packed
    // (a server that marks the copy as gzip has the browser unpack it already).
    async function fetchPacked(name, init, version) {
      const query = version ? `?v=${version}` : "";
      if (self.DecompressionStream) {
        const response = await fetch(name + ".gz" + query, init).catch(() => null);
        if (response && response.ok) {
          return { response, packed: !/gzip/i.test(response.headers.get("Content-Encoding") || "") };
        }
      }
      const response = await fetch(name + query, init);
      if (!response.ok) throw new Error(`${name}: HTTP ${response.status}`);
      return { response, packed: false };
    }
    function unpacked(body, packed) {
      return packed ? body.pipeThrough(new DecompressionStream("gzip")) : body;
    }
    // A stream that tells onBytes about every chunk passing through it.
    function counted(body, onBytes) {
      return body.pipeThrough(new TransformStream({ transform(chunk, out) { onBytes(chunk.length); out.enqueue(chunk); } }));
    }
    // "Downloading <what>… X of Y MB" as the bytes come (a total of 0: not known).
    function downloadProgress(what, total) {
      let received = 0;
      let shownMb = -1;
      return (bytes) => {
        received += bytes;
        const mb = Math.floor(received / 1e6);
        if (mb === shownMb) return;
        shownMb = mb;
        setStatus(total ? `Downloading ${what}… ${Math.min(mb, Math.round(total / 1e6))} of ${Math.round(total / 1e6)} MB`
                        : `Downloading ${what}… ${mb} MB`);
      };
    }

    // The files the game reads before it can be played come in one download, the startup pack,
    // fetched while the game's code loads; WebFileSystem.cpp waits for it, and without it the game
    // fetches each file when it first opens it. The pack comes in parts, a folder or a few each
    // (startup.json "parts"), a few downloading at once. A map's files come the same way when the game
    // enters it (packs/worldN.pack and .json, Module.muMapPack below): entering Lorencia file by file
    // took a minute on a phone (2026-10-29).
    // The browser keeps each pack as it came (packed) in its own storage, under the hash in its index,
    // so the next visit loads it from the device, and a release downloads only the packs that changed:
    // a phone's browser cache drops files this big. index.html?nostore neither uses nor fills that
    // storage.
    const STARTUP_STORE = "mu-web/startup-pack";
    const MAP_PACK_STORE = "mu-web/map-packs";
    const PACK_DOWNLOADS = 3;   // packs downloading at once
    async function openStore(name) {
      if (!self.caches || pageParams.has("nostore")) return null;
      try {
        return await caches.open(name);
      } catch (e) {
        return null;   // no storage in this browser (a private window, say)
      }
    }
    const packKey = (entry) => new URL(`${entry.name}?v=${entry.hash}`, location.href).href;
    const packPath = (key) => key.split("?")[0];
    // Keeps a pack's second stream (a tee of the download) for the next visit, and drops its older copies.
    function keepPack(label, store, entry, body, packed) {
      const key = packKey(entry);
      store.put(key, new Response(body, { headers: { "X-Mu-Packed": packed ? "1" : "0" } })).then(async () => {
        for (const request of await store.keys()) {
          if (request.url !== key && packPath(request.url) === packPath(key)) store.delete(request);
        }
        if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
        console.log(`${label} kept on this device (${entry.hash})`);
      }).catch((e) => console.warn(`${label} not kept on this device: ${e}`));
    }
    // Reads a pack ({name, hash, files: [[path, size], ...]}) into one array: from its copy on the
    // device (kept) or from the server, telling onNetworkBytes about each downloaded byte.
    async function readPack(label, entry, store, kept, onNetworkBytes) {
      let body, packed;
      if (kept) {
        body = kept.body;
        packed = kept.headers.get("X-Mu-Packed") === "1";
      } else {
        const source = await fetchPacked(entry.name, { cache: "no-store" });
        body = counted(source.response.body, onNetworkBytes);
        packed = source.packed;
        if (store) {
          const [forGame, forStore] = body.tee();
          body = forGame;
          keepPack(label, store, entry, forStore, packed);
        }
      }
      const total = entry.files.reduce((sum, file) => sum + file[1], 0);
      const bytes = new Uint8Array(total);
      const reader = unpacked(body, packed).getReader();
      let received = 0;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        if (received + value.length > total) throw new Error(`${entry.name} is bigger than its index says`);
        bytes.set(value, received);
        received += value.length;
      }
      if (received !== total) throw new Error(`${entry.name} is incomplete`);
      return { files: entry.files, bytes };
    }
    // A pack's files and bytes: from the device where it is kept and reads, else from the server.
    async function loadPack(label, entry, store, kept, onNetworkBytes) {
      if (kept) {
        try {
          const pack = await readPack(label, entry, null, kept, null);
          console.log(`${label} from this device (${entry.hash})`);
          return pack;
        } catch (e) {
          console.warn(`${label} on this device didn't read, downloading it again: ${e}`);
          await store.delete(packKey(entry)).catch(() => {});
        }
      }
      return readPack(label, entry, store, null, onNetworkBytes);
    }
    // Runs the tasks given to it at most `count` at a time, in the order given.
    function taskQueue(count) {
      let running = 0;
      const waiting = [];
      const finished = () => {
        running--;
        if (waiting.length) waiting.shift()();
      };
      return (task) => new Promise((resolve, reject) => {
        const start = () => {
          running++;
          task().then(resolve, reject).finally(finished);
        };
        if (running < count) start();
        else waiting.push(start);
      });
    }
    // The startup pack's parts, each a promise of its files and bytes (WebFileSystem.cpp takes them in
    // order as they come), or null where startup.json has none.
    async function startupPack() {
      const parts = releaseIndex && releaseIndex.parts;
      if (!parts) return null;
      const store = await openStore(STARTUP_STORE);
      const kept = await Promise.all(parts.map((part) => store && store.match(packKey(part)).catch(() => undefined)));
      if (store) {
        // Parts this release no longer has, the single pack of earlier releases among them.
        const current = new Set(parts.map((part) => packPath(packKey(part))));
        for (const request of await store.keys()) {
          if (!current.has(packPath(request.url))) store.delete(request);
        }
      }
      const toDownload = parts.reduce((sum, part, i) => sum + (kept[i] ? 0 : part.packed), 0);
      const onNetworkBytes = downloadProgress("game data", toDownload);
      if (toDownload) onNetworkBytes(0);
      else setStatus("Loading game data…");
      const queue = taskQueue(PACK_DOWNLOADS);
      return parts.map((part, i) => {
        const loading = queue(() => loadPack(`Startup pack part ${part.name}`, part, store, kept[i], onNetworkBytes));
        loading.catch(() => {});   // WebFileSystem.cpp says which part failed
        return loading;
      });
    }
    let packDone = false;
    const startupParts = startupPack();
    startupParts.then((parts) => Promise.allSettled(parts || []), () => {})
      .finally(() => { packDone = true; setStatus(""); });
    // WebFileSystem.cpp LoadWorldFiles: the files of the map folder the game enters (Data/WorldN,
    // ObjectN), or null where the map has no pack.
    async function mapPack(world) {
      try {
        const indexResponse = await fetch(`packs/world${world}.json`, { cache: "no-cache" });
        if (!indexResponse.ok) return null;
        const entry = Object.assign({ name: `packs/world${world}.pack` }, await indexResponse.json());
        const store = await openStore(MAP_PACK_STORE);
        const kept = store ? await store.match(packKey(entry)).catch(() => undefined) : undefined;
        return await loadPack(`Map pack ${world}`, entry, store, kept, downloadProgress("the map", entry.packed || 0));
      } finally {
        setStatus("");
      }
    }

    // Global for Main.js, which picks up an existing Module object.
    window.Module = {
      canvas,
      muStartupPack: startupParts,
      muMapPack: mapPack,
      muClipDistances: gpuCheck.clipDistances,
      muKeyboard: phone ? phoneKeyboard : undefined,
      muDevice: device.kind,
      print: (text) => { if (gpuErrorEcho(text)) return; console.log(text); appendLog(text, false); },
      printErr: (text) => { if (!gpuErrorEcho(text) && appendLog(text, true)) console.error(text); },
      setStatus: (text) => { if (packDone || text) setStatus(text); },
      onRuntimeInitialized: () => {
        if (packDone) setStatus("");
        canvas.focus();
        setInterval(saveConfig, 3000);
        addEventListener("pagehide", saveConfig);
      },
      onAbort: (what) => gameCrashed(what),
      // Main.js calls this instead of fetching Main.wasm itself: the gzip copy where there is one
      // (fetchPacked), Main.wasm where that fails.
      instantiateWasm: (imports, done) => {
        (async () => {
          let result;
          try {
            const source = await fetchPacked("Main.wasm", { credentials: "same-origin" }, code["Main.wasm"]);
            const wasm = new Response(unpacked(source.response.body, source.packed), { headers: { "Content-Type": "application/wasm" } });
            result = await WebAssembly.instantiateStreaming(wasm, imports);
          } catch (e) {
            appendLog(`Main.wasm.gz didn't load (${e}), taking Main.wasm`, true);
            result = await WebAssembly.instantiateStreaming(fetch(versioned("Main.wasm"), { credentials: "same-origin" }), imports);
          }
          done(result.instance, result.module);
        })().catch((e) => gameCrashed("Main.wasm: " + e));
        return {};
      },
    };
    const script = document.createElement("script");
    script.src = versioned("Main.js");
    script.onerror = () => setStatus("Main.js didn't load: is the web build in this folder?", true);
    document.body.appendChild(script);
  });
</script>
</body>
</html>
